# Mutations that must turn a named case RED. One per line:
#   <file at the repo root> | <sed expression applied to a copy> | <case under tests/cases>
# The field separator is '|', so a sed expression must use another delimiter (#).
# Run: sh tests/mutate.sh — a row that stays green, or a sed that changes
# nothing, fails the run. The rows cover the shutdown contract (audit §H2):
# the marker, TERM at the request, the stand-downs, the keep, the lock modes.
wittypi-daemon                   | s#^wp_halt_write daemon "" requested#true#                                                        | wittypi-daemon
wittypi-daemon                   | s#( trap '' TERM INT; exec "$WP_WAKE_GUARD" ensure )#"$WP_WAKE_GUARD" ensure#                    | wittypi-daemon
wittypi-daemon                   | s#^    wp_probe=$(( wp_probe + 1 ))$#    wp_probe=$(( wp_probe + 10 ))#                          | wittypi-daemon
systemd/wittypi.service          | s#^TimeoutStopSec=10$#TimeoutStopSec=5#                                                             | wittypi-daemon
wittypi-schedule                 | s#^        wp_sched_keep=1$#        wp_sched_keep=1; wp_sched_stop=$(( wp_sched_stop + wp_sched_cycle ))# | wittypi-schedule
wittypi-schedule                 | s#^if \[ "$wp_sched_a2_latch" = 1 \] && \[ "$wp_sched_now_s" -ge "$wp_sched_stop" \] \\$#if false \\#  | wittypi-schedule
wittypi-schedule                 | s#^if wp_halt_requested; then$#if false; then#                                                      | wittypi-schedule
wittypi-schedule                 | s#^if \[ "$wp_sched_a1_latch" = 0 \] && sched_alarm_holds#if false \&\& sched_alarm_holds#           | wittypi-schedule
wittypi-watch                    | s#^    if \[ "$WP_WATCH_REPAIRED" = 1 \]; then$#    if false; then#                                 | wittypi-watch
wittypi-watch                    | s#^    if \[ "$1" = wittypi-schedule.service \] && \[ "$WP_WATCH_REPAIR_SCHEDULE" != "1" \]; then$#    if false; then# | wittypi-watch
wittypi-watch                    | s#^if wp_halt_requested; then$#if false; then#                                                      | wittypi-watch
wittypi-watch                    | s#wp_lock s "$WP_WATCH_LOCK_WAIT" "wittypi-watch rtc"#wp_lock x "$WP_WATCH_LOCK_WAIT" "wittypi-watch rtc"# | wittypi-watch
wittypi-shutdown-gate            | s#"$GATE_WITTYPI" halt-request gate "$GATE_FALLBACK"#true#                                          | wittypi-shutdown-gate
wittypi-shutdown-gate            | s#^    GATE_IMMEDIATE=0$#    GATE_IMMEDIATE=1#                                                      | wittypi-shutdown-gate
wittypi-shutdown-gate            | s#^gate_unmark$#:#                                                                                  | wittypi-shutdown-gate
wittypi                          | s#wp_halt_write "$wp_hr_src" "${3:-}" requested#wp_halt_write "$wp_hr_src" "${3:-}" armed#          | wittypi-shutdown-gate
wittypi-lib.sh                   | s#^WP_HALT_STALE_SEC=120$#WP_HALT_STALE_SEC=999999#                                                  | wittypi-schedule
systemd/wittypi-rtc-save.service | s#^KillMode=mixed$##                                                                                | wittypi-lock
timing-windows                   | s#^_SD_B=$(( WATCH_SD + T_SHUTDOWN ))$#_SD_B=$(( WATCH_SD ))#                                    | timing-windows
wittypi-lib.sh                   | s#^        "$WP_ID_L3V7") WP_MODEL=l3v7 ;;$#        *) WP_MODEL=l3v7 ;;#                  | wittypi
wittypi-lib.sh                   | s#^        l3v7) ;;$#        l3v7) return 0 ;;#                                                    | wittypi
wittypi-lib.sh                   | s#wp_vet_write "$wp_sn_r" "$wp_sn_v" #true #                                                     | wittypi
wittypi                          | s#wp_p_lv=$WP_L3V7_LOW_VOLTAGE; wp_p_rv=1#wp_p_lv=$WP_EEPROM_UNSET; wp_p_rv=$WP_EEPROM_UNSET#  | wittypi
wittypi                          | s#if \[ "$WP_MODEL" = l3v7 \] && \[ "$wp_p_mode" != "0" \]; then#if false; then#                 | wittypi
wittypi                          | s#    wp_vet_write "$wp_r" "$3" #    true #                                                         | wittypi
